name: lottery

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottery}
      MYSQL_USER: ${MYSQL_USER:-lottery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lottery}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-lottery}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lottery}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  backend-init:
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    image: lottery-backend:local
    restart: "no"
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lottery}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-lottery}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lottery}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-lottery}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lottery}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lottery}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8080/storage}
      MINIO_SECURE: "false"
      CORS_ORIGINS: "[]"
      TZ: Asia/Shanghai
    command: ["sh", "-c", "python -m scripts.seed_admin && python -m scripts.migrate_prize_daily_limit"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: lottery-backend:local
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lottery}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-lottery}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lottery}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-lottery}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lottery}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lottery}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8080/storage}
      MINIO_SECURE: "false"
      CORS_ORIGINS: "[]"
      TZ: Asia/Shanghai
    depends_on:
      backend-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  worker:
    image: lottery-backend:local
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lottery}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-lottery}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lottery}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-lottery}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lottery}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lottery}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8080/storage}
      MINIO_SECURE: "false"
      CORS_ORIGINS: "[]"
      TZ: Asia/Shanghai
    command: ["python", "-m", "app.tasks.worker"]
    depends_on:
      backend-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  internal:
    driver: bridge
